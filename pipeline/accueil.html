<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sur Pièce</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{--paper:#EDEFEA;--panel:#FAFBF8;--panel-2:#F2F4F0;--ink:#161918;--ink-2:#555B57;--line:#CDD2CB;--accent:#2C49B8;--accent-ink:#fff;--ok:#2F7A4A;--warn:#A8471F;--ui:"Archivo","Helvetica Neue",Arial,sans-serif;--mono:"DM Mono",ui-monospace,Menlo,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#101312;--panel:#181C1A;--panel-2:#1F2421;--ink:#E6E9E4;--ink-2:#A1A8A2;--line:#2E3431;--accent:#93A8FF;--accent-ink:#0E1120;--ok:#6FCB8F;--warn:#F08A5D;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#101312;--panel:#181C1A;--panel-2:#1F2421;--ink:#E6E9E4;--ink-2:#A1A8A2;--line:#2E3431;--accent:#93A8FF;--accent-ink:#0E1120;--ok:#6FCB8F;--warn:#F08A5D;color-scheme:dark}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--ui);-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:40px 20px 80px;display:grid;gap:28px}
header{display:grid;gap:8px}
.kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
h1{margin:0;font-weight:800;font-variation-settings:"wdth" 112;font-size:clamp(30px,4.6vw,54px);line-height:1.02;letter-spacing:-.015em;text-wrap:balance}
.lead{margin:0;max-width:62ch;color:var(--ink-2);font-size:17px}
.drop{border:2px dashed var(--ink);background:var(--panel);min-height:230px;display:grid;place-items:center;text-align:center;padding:28px;cursor:pointer;transition:background .15s,border-color .15s}
.drop.off{cursor:not-allowed;opacity:.6;border-style:solid}.drop.off.over{background:var(--panel);border-color:var(--ink)}
.drop.over{background:color-mix(in srgb,var(--accent) 10%,var(--panel));border-color:var(--accent)}
.drop b{display:block;font-size:24px;font-weight:800;font-variation-settings:"wdth" 110}
.drop span{color:var(--ink-2)}
.dz{display:flex;flex-direction:column;align-items:center;gap:6px}.drop .btn{margin-top:10px}
a.btn{text-decoration:none;display:inline-block}
.btn{border:1.5px solid var(--ink);background:var(--panel);color:var(--ink);padding:10px 16px;font:600 15px var(--ui);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.facts div{border-top:1.5px solid var(--ink);padding-top:8px;font-size:14px;color:var(--ink-2)}
.facts b{display:block;color:var(--ink);font-size:15px}
.job{background:var(--panel);border:1.5px solid var(--ink);padding:20px;display:grid;gap:14px}
.job h2{margin:0;font-size:20px;font-weight:800;font-variation-settings:"wdth" 108}
.bar{position:relative;height:30px;background:var(--panel-2);border:1.5px solid var(--ink);overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent);transition:width 1.2s ease}
.bar .pct{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:600 14px var(--mono);mix-blend-mode:difference;color:#fff}
.notif{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:14px;color:var(--ink-2)}
.fun{margin:0;min-height:1.5em;font-size:17px;font-weight:600;font-variation-settings:"wdth" 105;transition:opacity .4s}
.fun.fade{opacity:0}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.steps li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:baseline}
.steps li::before{content:"";width:12px;height:12px;border:1.5px solid var(--line);border-radius:50%;justify-self:center;transform:translateY(1px)}
.steps li.done::before{background:var(--ok);border-color:var(--ok)}
.steps li.cur::before{border-color:var(--accent);background:var(--accent);animation:pulse 1.2s infinite}
.steps li.wait::before{border-color:var(--warn)}
.steps small{display:block;color:var(--ink-2);font-family:var(--mono);font-size:12px}
@keyframes pulse{50%{opacity:.35}}
.msg{font-weight:600}
.msg.refus,.msg.erreur{color:var(--warn)}
.detail{margin:-8px 0 0;font:500 12px var(--mono);color:var(--ink-2)}
.warn{margin:0;padding-left:18px;color:var(--warn);font-size:14px;display:grid;gap:3px}
.calib{display:grid;gap:10px}
.calib .imgbox{position:relative;overflow:auto;max-height:70vh;border:1px solid var(--line);background:var(--panel-2)}
.calib img{display:block;max-width:none;cursor:crosshair;box-shadow:0 0 0 1px var(--ink-2)}
.calib svg{position:absolute;inset:0;pointer-events:none}
.calib .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.calib input{font:500 16px var(--mono);width:110px;padding:8px;border:1.5px solid var(--ink);background:var(--panel-2);color:var(--ink)}
.result{display:grid;gap:12px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.thumbs img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:#111}
.rooms{display:flex;flex-wrap:wrap;gap:6px}.rooms span{border:1px solid var(--line);background:var(--panel-2);padding:3px 8px;font:500 13px var(--mono)}
.list h2{margin:0 0 10px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--panel);border:1.5px solid var(--ink);text-decoration:none;color:inherit;display:grid}
.card img,.card .ph{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:var(--panel-2)}
.card div{padding:8px 10px;font-weight:600;font-size:14px}
.plans{width:100%;border-collapse:collapse;font-size:14px;background:var(--panel);border:1.5px solid var(--ink)}
.plans th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);padding:8px 10px;border-bottom:1.5px solid var(--ink)}
.plans td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.plans td img,.plans td .ph{width:72px;height:45px;object-fit:cover;display:block;background:var(--panel-2)}
.plans td small{display:block;font:500 11.5px var(--mono);color:var(--ink-2)}
.plans .st.fini{color:var(--ok)}.plans .st.erreur,.plans .st.refus{color:var(--warn)}.plans .st.en_cours,.plans .st.attente{color:var(--accent)}
.plans .liens{display:flex;gap:6px;justify-content:flex-end}.plans .liens .btn{padding:5px 9px;font-size:13px}
.docs{position:relative}.docs summary{list-style:none;cursor:pointer;padding:5px 9px;font-size:13px}.docs summary::-webkit-details-marker{display:none}
.docs ul{position:absolute;right:0;top:calc(100% + 4px);z-index:20;margin:0;padding:6px;list-style:none;width:340px;max-height:60vh;overflow:auto;background:var(--panel);border:1.5px solid var(--ink);box-shadow:0 8px 24px rgba(0,0,0,.18)}
.docs li a{display:grid;gap:1px;padding:6px 8px;text-decoration:none;color:var(--ink)}.docs li a:hover{background:var(--panel-2)}
.docs li span{font-size:13px;font-weight:600}.docs li small{font:500 11px var(--mono);color:var(--ink-2)}
.app{display:flex;align-items:baseline;gap:10px;margin-bottom:-8px}.app b{font-size:22px;font-weight:800;font-variation-settings:"wdth" 110;letter-spacing:-.01em}.app span{font:500 12px var(--mono);color:var(--ink-2)}
.lhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.lhead h2{margin:0!important}
.outils{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.outils .btn{padding:6px 10px;font-size:13px}.outils .tog{font-size:12px;color:var(--ink-2);display:flex;gap:5px;align-items:center}
.implog{margin:0 0 10px;padding:8px 10px;background:var(--panel);border:1px solid var(--line);font:12px/1.45 var(--mono);white-space:pre-wrap;max-height:220px;overflow:auto}
.mono{font-family:var(--mono)}.sub{color:var(--ink-2)}
h1{font-size:clamp(24px,3vw,34px)!important}
.drop{min-height:120px!important;padding:16px!important}.drop b{font-size:19px!important}
.card small{display:block;color:var(--ink-2);font-weight:400;font-family:var(--mono);font-size:11.5px}
/* téléphone : la colonne ne s'élargit jamais pour son contenu (sinon toute la page défile de côté) ; le tableau des plans devient
   une fiche par plan (vignette, titre, statut, date, puis les boutons sur leur propre ligne) */
.wrap{grid-template-columns:minmax(0,1fr)}
.job h2{overflow-wrap:anywhere}
.plans .liens .btn,.docs summary{white-space:nowrap}
@media (max-width:640px){
  .wrap{padding:24px 16px 60px;gap:22px}
  .plans,.plans tbody{display:block}
  .plans thead{display:none}
  .plans tr{position:relative;display:grid;grid-template-columns:88px minmax(0,1fr) auto;grid-template-areas:"img titre titre" "img st date" "liens liens liens";gap:2px 12px;align-items:center;padding:10px;border-bottom:1px solid var(--line)}
  .plans tr:last-child{border-bottom:0}
  .plans td{padding:0;border:0;min-width:0}
  .plans td:nth-child(1){grid-area:img}.plans td:nth-child(2){grid-area:titre;overflow-wrap:anywhere}.plans td:nth-child(3){grid-area:st}
  .plans td:nth-child(4){grid-area:date;font-size:12px;color:var(--ink-2)}.plans td:nth-child(5){grid-area:liens;margin-top:8px}
  .plans td img,.plans td .ph{width:88px;height:55px}
  .plans .liens{justify-content:flex-start;flex-wrap:wrap}.plans .liens .btn,.docs summary{padding:8px 12px;font-size:14px}
  .docs{position:static}.docs ul{left:10px;right:10px;width:auto;top:calc(100% - 6px)}
}
</style>
</head>
<body>
<main class="wrap">
  <header class="app"><b>Sur Pièce</b><span>nom provisoire</span></header>

  <label class="drop" id="drop">
    <input type="file" id="file" accept=".pdf,.png,.jpg,.jpeg,.webp" hidden>
    <div class="dz"><b>Glissez le plan ici</b><span>PDF vectoriel du promoteur de préférence · PNG ou JPG accepté</span><span class="btn">Choisir un fichier</span></div>
  </label>


  <section class="job" id="job" hidden>
    <h2 id="jobTitle">Traitement</h2>
    <div class="bar" id="bar"><i id="barFill"></i><span id="barPct" class="pct">0 %</span></div>
    <div class="notif" id="notifBox" hidden><button class="btn" id="notifBtn" type="button">Me prévenir quand c’est prêt</button><span id="notifTxt">Vous pouvez fermer cet onglet ou faire autre chose, on vous prévient.</span></div>
    <p class="fun" id="fun"></p>
    <ol class="steps" id="steps"></ol>
    <p class="msg" id="msg"></p>
    <p class="detail" id="detail" hidden></p>
    <ul class="warn" id="warns"></ul>
    <div><button class="btn" id="retry" type="button" hidden>Relancer cette étape</button></div>
    <div class="calib" id="calib" hidden>
      <div class="imgbox" id="imgbox"><img id="cimg" alt="Plan à calibrer"><svg id="csvg"></svg></div>
      <div class="row"><span id="cstate">Cliquez la première extrémité de la cote.</span>
        <label>Longueur <input id="clen" inputmode="decimal" placeholder="4,12" aria-describedby="cstate"> m</label>
        <button class="btn" id="cfix" type="button" hidden></button>
        <button class="btn" id="creset" type="button">Recommencer</button>
        <button class="btn primary" id="cok" type="button" disabled>Valider la cote</button></div>
    </div>
    <div class="result" id="result" hidden>
      <div class="rooms" id="rooms"></div>
      <div class="thumbs" id="thumbs"></div>
      <div><a class="btn primary" id="open" href="#">Ouvrir la visite</a> <a class="btn" id="open360" href="#" hidden>Visite 360°</a></div>
    </div>
  </section>

  <section class="list"><div class="lhead"><h2>Plans traités</h2><div class="outils" id="outils" hidden>
    <a class="btn" id="expAll" href="api/export">Exporter tout</a>
    <label class="btn">Importer une archive<input type="file" id="impFile" accept=".gz,.tgz,application/gzip" hidden></label>
    <button class="btn" type="button" id="impUrl">Importer depuis une adresse</button>
    <label class="tog"><input type="checkbox" id="impRempl"> remplacer un plan de même identifiant</label></div></div>
    <pre class="implog" id="impLog" hidden></pre><div id="list"></div></section>
</main>
<script>
const $ = s => document.querySelector(s);
const STEPS = [['analyse', 'Analyse du fichier'], ['calibration', 'Échelle'], ['lecture', 'Lecture du plan'], ['controle', 'Visite de contrôle'], ['photos', '3D et photos'], ['pano', 'Visite à 360°'], ['fini', 'Visite prête']];
let cur = null, timer = null, pts = [], shown = 0, lastPct = 0, busy = false, sendTok = 0;
// mode admin (outil local, L4-19 : « droit au but », tout visible pour déboguer) : détail technique (erreur brute, avertissements destinés
// à l'IA) toujours montré. Jamais montré à l'acquéreur : dans le SaaS, seulement pour l'administrateur (lot 5)
const ADMIN = true, DEBUG = ADMIN || new URLSearchParams(location.search).get('debug') === '1';
// chronologie de chantier : chaque phrase apparaît quand la barre atteint son pourcentage, une seule fois, dans l'ordre
const CHANTIER = [
  [0, 'Réception du plan…'], [2, 'On déroule le plan sur la table de chantier…'], [4, 'On cherche le nord…'], [6, 'On vérifie l’échelle au mètre ruban…'], [8, 'On repère les murs porteurs…'],
  [10, 'Ouverture du chantier : on monte la palissade…'], [13, 'Livraison de la grue…'], [16, 'Implantation : on trace les axes au sol…'], [19, 'On coffre la dalle…'],
  [22, 'On coule la dalle, le béton prend son temps…'], [25, 'Décoffrage de la dalle…'], [28, 'On monte les voiles béton…'], [31, 'On réserve les trous des fenêtres…'],
  [34, 'On pose les linteaux…'], [37, 'On monte les gaines techniques…'], [40, 'On pose les doublages isolants…'], [43, 'On trace les cloisons au cordeau…'],
  [46, 'Rails et plaques de plâtre…'], [49, 'On pose les huisseries des portes…'], [52, 'On vérifie le sens d’ouverture de chaque porte…'], [55, 'On pose les fenêtres et la porte-fenêtre…'],
  [58, 'On fixe les garde-corps…'], [61, 'On installe les brise-soleil…'], [64, 'Le plombier arrive : arrivées d’eau et évacuations…'], [67, 'On pose la douche, la vasque et le WC…'],
  [70, 'L’électricien tire ses câbles…'], [73, 'On mesure chaque pièce au télémètre laser…'], [76, 'On compare les surfaces au tableau du promoteur…'],
  [79, 'Enduits et bandes sur les plaques…'], [81, 'Première couche de peinture…'], [83, 'Deuxième couche, c’est plus propre…'], [85, 'On pose le parquet…'],
  [87, 'Carrelage et faïence dans la salle d’eau…'], [89, 'On pose les plinthes…'], [91, 'On branche les luminaires…'], [93, 'Ménage de fin de chantier, on lave les vitres…'],
  [95, 'On ouvre les stores, la lumière entre…'], [97, 'Le photographe cherche le bon angle…'], [99, 'Dernières photos…'], [100, 'Réception des travaux : les clés sont sur la porte.'],
];
let chantierIdx = -1, stopped = false, notified = {};
const canNotify = 'Notification' in window;
function notify(title, body) {
  if (!canNotify || Notification.permission !== 'granted' || !document.hidden) return;
  try { const n = new Notification(title, { body }); n.onclick = () => { window.focus(); n.close(); }; } catch (e) {}
}
function notifUI(active) {
  const box = $('#notifBox'); box.hidden = !active || !canNotify || Notification.permission === 'denied';
  if (canNotify && Notification.permission === 'granted') { $('#notifBtn').hidden = true; $('#notifTxt').textContent = 'Vous serez prévenu dès que la visite est prête, même dans un autre onglet.'; }
}
if (canNotify) document.addEventListener('click', e => { if (e.target.id === 'notifBtn') Notification.requestPermission().then(() => notifUI(true)); });
function chantier(p) {
  if (stopped) return;
  let i = 0; while (i + 1 < CHANTIER.length && CHANTIER[i + 1][0] <= p) i++;
  if (i <= chantierIdx) return; chantierIdx = i;
  const el = $('#fun'); el.classList.add('fade'); setTimeout(() => { el.textContent = CHANTIER[i][1]; el.classList.remove('fade'); }, 300);
}
// la barre avance en douceur entre deux nouvelles du serveur, sans jamais reculer ; elle s'arrête avec le chantier (refus, erreur, attente d'échelle)
setInterval(() => { if (shown < lastPct) shown = Math.min(lastPct, shown + Math.max(0.3, (lastPct - shown) * 0.25)); else if (!stopped && lastPct && lastPct < 100 && shown < Math.min(97, lastPct + 10)) shown += 0.04; $('#barFill').style.width = shown + '%'; $('#barPct').textContent = Math.floor(shown) + ' %'; chantier(shown); }, 250);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fr = (v, n = 2) => (Math.round(v * 10 ** n) / 10 ** n).toString().replace('.', ',');
// adresses relatives : la même page sert l'outil local (racine) et la copie partagée (sous-dossier d'un site, GitHub Pages)
const planUrl = (id, f = '') => `plans/${encodeURIComponent(id)}/${f}`;

// changer de plan (dépôt ou carte) : rien de l'ancien ne reste affiché, et ses réponses en retard sont ignorées
function reset() {
  clearInterval(timer); timer = null; cur = null; pts = []; shown = lastPct = 0; chantierIdx = -1; stopped = false;
  ['#calib', '#result', '#retry', '#detail', '#cfix'].forEach(s => $(s).hidden = true);
  ['#steps', '#warns', '#thumbs', '#rooms'].forEach(s => $(s).innerHTML = '');
  $('#msg').className = 'msg'; $('#msg').textContent = ''; $('#fun').textContent = ''; $('#clen').value = ''; $('#cok').disabled = true;
}
async function send(file) {
  if (!file) return;
  const tok = ++sendTok; reset(); $('#job').hidden = false; $('#jobTitle').textContent = file.name; $('#msg').textContent = 'Envoi…';
  const fail = t => { if (tok !== sendTok) return; $('#msg').className = 'msg refus'; $('#msg').textContent = t; };
  try {
    if (!file.size) return fail('Fichier vide.');
    if (file.size > 40e6) return fail('Fichier trop lourd (40 Mo maximum).');
    const r = await fetch('api/depot', { method: 'POST', headers: { 'x-nom': encodeURIComponent(file.name) }, body: file });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.id) return fail(j.erreur || `Envoi impossible (erreur ${r.status}).`);
    if (tok === sendTok) { if (j.existant) $('#jobTitle').textContent = `${file.name} · déjà déposé : c’est ce plan, rien n’est refait`; follow(j.id); list(); }
  } catch (e) { fail('Envoi impossible : le serveur ne répond pas.'); }
  finally { $('#file').value = ''; }
}
function follow(id) { if (id !== cur) { shown = 0; lastPct = 0; chantierIdx = -1; } stopped = false; cur = id; clearInterval(timer); poll(); timer = setInterval(poll, 1500); }
async function poll() {
  const id = cur; if (!id) return;
  let s; try { const r = await fetch('api/etat/' + encodeURIComponent(id)); if (!r.ok) return; s = await r.json(); } catch (e) { return; }
  if (id !== cur) return;  // réponse d'un plan qu'on a quitté entre-temps
  const doneSteps = (s.etapes || []).map(e => e.etape), idx = STEPS.findIndex(t => t[0] === s.etape);
  $('#steps').innerHTML = STEPS.filter(t => t[0] !== 'calibration' || doneSteps.includes('calibration') || s.etape === 'calibration').map(([k, t]) => {
    const ds = (s.etapes || []).filter(e => e.etape === k), d = ds[0], i = STEPS.findIndex(x => x[0] === k);  // une étape peut avoir plusieurs textes (plan reconnu, niveaux)
    const cls = d || s.statut === 'fini' || i < idx ? 'done' : k === s.etape ? (s.statut === 'attente' ? 'wait' : s.statut === 'en_cours' ? 'cur' : '') : '';
    return `<li class="${cls}"><span>${t}${ds.filter(x => x.texte).map(x => `<small>${esc(x.texte)}</small>`).join('')}</span></li>`;
  }).join('');
  $('#msg').className = 'msg ' + (s.statut || ''); $('#msg').textContent = ['refus', 'erreur', 'attente'].includes(s.statut) ? (s.message || '') : '';
  if (s.pct != null) lastPct = Math.max(lastPct, s.pct);
  notifUI(s.statut === 'en_cours');
  document.title = s.statut === 'en_cours' ? `${Math.floor(Math.max(shown, s.pct || 0))} % · Sur Pièce` : 'Sur Pièce';
  const key = id + ':' + s.statut + ':' + s.etape;
  if (!notified[key]) {
    if (s.statut === 'fini') { notified[key] = 1; notify('Votre visite 3D est prête', 'Le plan, la maquette et les photos vous attendent.'); }
    else if (s.statut === 'attente') { notified[key] = 1; notify('Une précision est nécessaire', 'Indiquez une cote connue du plan pour continuer.'); }
    else if (s.statut === 'erreur' || s.statut === 'refus') { notified[key] = 1; notify('Le traitement s’est arrêté', s.message || ''); }
  }
  stopped = ['refus', 'erreur', 'attente'].includes(s.statut);
  if (stopped) $('#fun').textContent = s.statut === 'attente' ? 'Le chantier attend votre coup de mètre.' : 'Chantier à l’arrêt.';
  $('#warns').innerHTML = [...(s.avertissements || []), ...(DEBUG ? s.avertissements_lecture || [] : [])].map(a => `<li>${esc(a)}</li>`).join('');
  if (!(s.statut === 'attente' && s.etape === 'calibration')) $('#calib').hidden = true;
  else if ($('#calib').hidden) showCalib(s);
  $('#retry').hidden = s.statut !== 'erreur';
  $('#detail').hidden = !(DEBUG && ['erreur', 'refus'].includes(s.statut) && s.technique_erreur); $('#detail').textContent = DEBUG ? s.technique_erreur || '' : '';

  $('#rooms').innerHTML = (s.pieces || []).map(p => `<span>${esc(p[0])}${p[1] ? ' · ' + esc(p[1]) + (/^\d/.test(p[1]) ? ' m²' : '') : ''}</span>`).join('');
  let plan = {}; try { plan = await (await fetch(planUrl(id, 'plan.json'))).json(); } catch (e) {}

function showCalib(s) {
  pts = []; $('#calib').hidden = false; $('#cok').disabled = true; const img = $('#cimg');
  img.onload = () => { const w = Math.min(img.naturalWidth, $('#imgbox').clientWidth * 1.6); img.style.width = w + 'px'; draw(); };
  img.src = planUrl(cur, encodeURIComponent(s.image || 'calibration.png')) + `?t=${Date.now()}`;
}
// cote en mètres, entre 0,30 et 25 : « 412 » (centimètres, comme sur les plans) n'est pas pris pour 412 m
const lenVal = () => parseFloat($('#clen').value.replace(/\s/g, '').replace(',', '.'));
function calibOk() {
  const m = lenVal(), px = pts.length === 2 ? Math.hypot(pts[1][0] - pts[0][0], pts[1][1] - pts[0][1]) : 0;
  return { m, px, ok: pts.length === 2 && m >= 0.3 && m <= 25 && px >= 40, cm: !(m <= 25) && m / 100 >= 0.3 && m / 100 <= 25 };
}
function draw() {
  const img = $('#cimg'), k = img.clientWidth / (img.naturalWidth || 1), svg = $('#csvg');
  svg.setAttribute('width', img.clientWidth); svg.setAttribute('height', img.clientHeight);
  svg.innerHTML = pts.map(p => `<circle cx="${p[0] * k}" cy="${p[1] * k}" r="6" fill="none" stroke="#e33" stroke-width="2"/>`).join('') + (pts.length === 2 ? `<line x1="${pts[0][0] * k}" y1="${pts[0][1] * k}" x2="${pts[1][0] * k}" y2="${pts[1][1] * k}" stroke="#e33" stroke-width="2"/>` : '');
  const { m, px, ok, cm } = calibOk(), typed = $('#clen').value.trim();
  let t = pts.length === 0 ? 'Cliquez la première extrémité de la cote.' : pts.length === 1 ? 'Cliquez la seconde extrémité.' : 'Indiquez la longueur de cette cote, en mètres.';
  if (pts.length === 2 && px < 40) t = 'Les deux points sont trop proches : choisissez une cote plus longue.';
  else if (pts.length === 2 && typed) t = cm ? `« ${typed} » ressemble à des centimètres : la longueur se saisit en mètres, soit ${fr(m / 100)} m.`
    : !ok ? 'Indiquez la longueur en mètres, entre 0,30 et 25 (ex. 4,12).'
    : `Échelle obtenue : 1 m = ${Math.round(px / m)} px ; la page entière mesurerait ${fr(img.naturalWidth * m / px, 1)} × ${fr(img.naturalHeight * m / px, 1)} m.`;
  $('#cstate').textContent = t;
  $('#cfix').hidden = !(pts.length === 2 && cm); if (cm) $('#cfix').textContent = `Corriger en ${fr(m / 100)} m`;
  $('#cok').disabled = busy || !ok;
}
$('#cimg').addEventListener('click', e => {
  const img = e.currentTarget, r = img.getBoundingClientRect(), k = img.naturalWidth / img.clientWidth, x = (e.clientX - r.left) * k, y = (e.clientY - r.top) * k;
  if (!(x >= 0 && y >= 0 && x <= img.naturalWidth && y <= img.naturalHeight)) return;  // hors de l'image : ignoré

$('#clen').addEventListener('input', draw);
$('#cfix').addEventListener('click', () => { const m = lenVal(); $('#clen').value = fr(m / 100); draw(); });
$('#retry').addEventListener('click', async () => {
  const id = cur; $('#retry').disabled = true;
  try {
    const r = await fetch('api/relancer/' + encodeURIComponent(id), { method: 'POST' }), j = await r.json().catch(() => ({}));
    if (id !== cur) return;
    if (!r.ok && r.status !== 409) { $('#msg').textContent = j.erreur || `Relance impossible (erreur ${r.status}).`; return; }
    $('#retry').hidden = true; follow(id);  // 409 : déjà relancé ailleurs, on suit simplement l'état

$('#creset').addEventListener('click', () => { pts = []; draw(); });
$('#cok').addEventListener('click', async () => {
  const id = cur, { m } = calibOk(); busy = true; $('#cok').disabled = true;
  try {
    const r = await fetch('api/calibration/' + encodeURIComponent(id), { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ p1: pts[0], p2: pts[1], m }) });
    const j = await r.json().catch(() => ({}));

    if (!r.ok) { $('#cstate').textContent = j.erreur || `Calibration refusée (erreur ${r.status}).`; return; }
    $('#calib').hidden = true; follow(id);
  } catch (e) { $('#cstate').textContent = 'Le serveur ne répond pas : réessayez.'; }

const drop = $('#drop');
['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => { if (DEPOT) send(e.dataTransfer.files[0]); });
$('#file').addEventListener('change', e => send(e.target.files[0]));
async function list() {

  const date = t => t ? new Date(t * 1000).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
  $('#list').innerHTML = l.length ? `<table class="plans"><thead><tr><th></th><th>Plan</th><th>Statut</th><th>Modifié</th><th></th></tr></thead><tbody>${l.map(p => `<tr data-id="${esc(p.id)}" data-titre="${esc(p.titre)}">
    <td>${p.photo ? `<img src="${esc(p.photo)}" alt="" loading="lazy">` : '<span class="ph"></span>'}</td>
    <td><b>${esc(p.titre)}</b><small>${esc(p.id)}</small></td><td class="st ${esc(p.statut)}">${esc(st[p.statut] || p.statut)}</td><td class="mono">${esc(date(p.date))}</td>
    <td><div class="liens">${p.statut === 'fini' ? `<a class="btn" href="${esc(planUrl(p.id))}">Visite</a>${p.pano ? `<a class="btn" href="${esc(planUrl(p.id, 'pano/'))}">360°</a>` : ''}<a class="btn" href="${esc(planUrl(p.id))}#admin">Admin</a>` : ''}<details class="docs" data-id="${esc(p.id)}"><summary class="btn">Documents ▾</summary><ul>${STATIQUE ? '' : `<li><a href="api/export?ids=${encodeURIComponent(p.id)}"><span>Exporter ce plan (.tar.gz)</span><small>tout le dossier, réimportable</small></a></li>`}<li class="sub">Chargement…</li></ul></details>${STATIQUE ? '' : '<button class="btn suivre" type="button">Suivi</button>'}</div></td></tr>`).join('')}</tbody></table>` : '<p class="sub">Aucun plan pour l’instant.</p>';
}
// documents d'un plan : tous les fichiers du dossier (outil local : api/admin/<id> ; copie partagée : plans/<id>/admin/fichiers.json)
const ROLES = [[/^source\.pdf$/, 'Plan déposé (PDF d’origine)'], [/^source\./, 'Plan déposé (image d’origine)'], [/^page\.png$/, 'Page déposée (image)'], [/^plan-src\.png$/, 'Plan recadré, lu par l’IA'],
  [/^calibration\.png$/, 'Calibration (échelle)'], [/^plan-.+\.png$/, 'Plan superposable au plan 2D'], [/^plan\.json$/, 'Plan généré (moteur de visite)'], [/^extract\.json$/, 'Analyse du fichier, sans IA'],
  [/^reponse-ia\.json$/, 'Lecture de l’IA (gardée)'], [/^relecture-ia\.json$/, 'Relecture de l’IA'], [/^reponse-brute.*\.txt$/, 'Réponse brute de l’IA'], [/^appels-ia\.json$/, 'Appels à l’IA (durées, coûts)'],
  [/^rapport\.json$/, 'Rapport d’assemblage'], [/^controle\.json$/, 'Visite de contrôle'], [/^pano\/controle\.json$/, 'Contrôle du 360°'], [/^etat\.json$/, 'Avancement'],
  [/^relecture\.png$/, 'Image de relecture'], [/^zoom-.+\.png$/, 'Zoom de relecture'], [/^duel-.+\.png$/, 'Arbitrage (image posée à l’IA)']];
const rang = n => { const i = ROLES.findIndex(([re]) => re.test(n)); return i < 0 ? 99 : i; }, role = n => (ROLES.find(([re]) => re.test(n)) || [0, n])[1];

$('#list').addEventListener('toggle', async e => {
  const d = e.target; if (!d.matches || !d.matches('details.docs') || !d.open) return;
  document.querySelectorAll('details.docs[open]').forEach(x => { if (x !== d) x.open = false; });
  if (d.dataset.charge) return; d.dataset.charge = '1';

  let F = null; try { const r = await fetch(STATIQUE ? planUrl(id, 'admin/fichiers.json') : `api/admin/${encodeURIComponent(id)}`, { cache: 'no-store' }); if (r.ok) F = await r.json(); } catch (er) {}

}, true);
document.addEventListener('click', e => { if (!e.target.closest('details.docs')) document.querySelectorAll('details.docs[open]').forEach(x => { x.open = false; }); });
$('#list').addEventListener('click', e => { const b = e.target.closest('button.suivre'), tr = b && b.closest('tr'); if (!tr) return; sendTok++; reset(); $('#job').hidden = false; $('#jobTitle').textContent = tr.dataset.titre || 'Plan'; follow(tr.dataset.id); scrollTo({ top: 0, behavior: 'smooth' }); });
// import et export (outils/importer.mjs, exporter.mjs, par le serveur) : compte rendu affiché sous le titre

// dépôt possible seulement avec le serveur Python (pipeline/serveur.py) et une IA configurée (clé, ou rejeu des tests) ; sinon zone
