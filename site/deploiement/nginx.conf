# Site vitrine, pour un serveur nginx (VPS OVH). Racine : le contenu de site/dist/ (python3 outils/site.py).
# Équivalent de site/dist/.htaccess (hébergement mutualisé Apache).
server {
    listen 80;
    listen [::]:80;
    server_name dejachezmoi.fr www.dejachezmoi.fr;
    return 301 https://dejachezmoi.fr$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.dejachezmoi.fr;
    # ssl_certificate /etc/letsencrypt/live/dejachezmoi.fr/fullchain.pem;  ssl_certificate_key …/privkey.pem;
    return 301 https://dejachezmoi.fr$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dejachezmoi.fr;
    # ssl_certificate /etc/letsencrypt/live/dejachezmoi.fr/fullchain.pem;  ssl_certificate_key …/privkey.pem;
    root /var/www/dejachezmoi/dist;
    index index.html;
    charset utf-8;
    error_page 404 /404.html;

    # anciennes adresses : /index.html → /, /neuf.html → /neuf/
    rewrite ^(.*/)?index\.html$ /$1 permanent;
    rewrite ^/(neuf|ancien|conseillers|mentions-legales|confidentialite|cgu)\.html$ /$1/ permanent;

    location / { try_files $uri $uri/ =404; }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    location ~* \.html$ { add_header Cache-Control "no-cache"; }
    location ~* \.(css|js|json)$ { add_header Cache-Control "public, max-age=604800"; }
    location ~* \.(woff2|png|jpg|jpeg|svg|webp)$ { add_header Cache-Control "public, max-age=2592000"; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;
}
