<!doctype html>
<html lang="fr" data-version="20260928230340">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visite à 360°</title>
<link rel="icon" href="data:,">
<meta name="description" content="Visite à 360°, d'arrêt en arrêt">
<script src="visionneuse.js?v=20260928230340" defer></script>
<link rel="preload" href="visite.json?v=20260928230340" as="fetch" crossorigin="anonymous">
<link rel="preload" href="entree-512.jpg?v=20260928230340" as="fetch" crossorigin="anonymous">
<style>
/* couleurs de la visite (moteur/visite.css) ; polices du système : la page ne demande rien hors de son dossier */
:root{
  --paper:#EDEFEA; --panel:#FAFBF8; --panel-2:#F2F4F0; --ink:#161918; --ink-2:#555B57; --line:#CDD2CB;
  --accent:#2C49B8; --accent-ink:#FFFFFF; --plan-bg:#F7F8F5;
  --shadow:0 1px 2px rgba(22,25,24,.08),0 8px 24px rgba(22,25,24,.10);
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; --g:16px; --plan-filtre:none;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#101312; --panel:#181C1A; --panel-2:#1F2421; --ink:#E6E9E4; --ink-2:#A1A8A2; --line:#2E3431;
  --accent:#93A8FF; --accent-ink:#0E1120; --plan-bg:#141816; --plan-filtre:invert(.92) hue-rotate(180deg);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#101312; --panel:#181C1A; --panel-2:#1F2421; --ink:#E6E9E4; --ink-2:#A1A8A2; --line:#2E3431;
  --accent:#93A8FF; --accent-ink:#0E1120; --plan-bg:#141816; --plan-filtre:invert(.92) hue-rotate(180deg);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none !important} /* .ico, .niv… ont leur display : sans cela, un bouton caché restait affiché */
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:14px/1.4 var(--ui);-webkit-font-smoothing:antialiased;overflow:hidden;
  overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{position:fixed;inset:0;touch-action:none}
#vue{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;background:var(--paper)}
#vue.tire{cursor:grabbing}
#points{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.pt{pointer-events:auto;cursor:pointer;outline:none;filter:drop-shadow(0 1px 3px rgba(0,0,0,.45))}
.pt .disque{fill:rgba(255,255,255,.16);stroke:rgba(255,255,255,.95);stroke-width:2.2;transition:fill .15s}
.pt .coeur{fill:rgba(255,255,255,.92);stroke:none}
.pt:hover .disque,.pt:focus-visible .disque,.pt.actif .disque{fill:rgba(255,255,255,.42)}
.pt:focus-visible .disque{stroke:var(--accent);stroke-width:3}
/* étiquette d'un point de passage */
.etq{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:none;background:var(--panel);color:var(--ink);border:1.5px solid var(--ink);
  box-shadow:var(--shadow);padding:5px 9px;font-weight:600;font-variation-settings:"wdth" 90;white-space:nowrap;font-size:13px;opacity:0;transition:opacity .15s;display:flex;gap:6px;align-items:center}
.etq.vue{opacity:1}
.etq svg{width:12px;height:12px;flex:none}
.etq small{color:var(--ink-2);font-weight:500}
.ui{position:absolute;z-index:3}
/* cartouche : pièce courante */
.cart{top:calc(var(--g) + env(safe-area-inset-top,0px));left:calc(var(--g) + env(safe-area-inset-left,0px));background:var(--panel);border:1.5px solid var(--ink);box-shadow:var(--shadow);
  padding:8px 12px 9px;max-width:calc(100% - 2 * var(--g) - 104px)}
.cart .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
.cart .p{font-weight:800;font-variation-settings:"wdth" 110;font-size:21px;line-height:1.1;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cart .n{font-size:12px;color:var(--ink-2);font-weight:500}
/* boutons ronds */
.outils{top:calc(var(--g) + env(safe-area-inset-top,0px));right:calc(var(--g) + env(safe-area-inset-right,0px));display:flex;gap:6px}
.ico{width:42px;height:42px;display:grid;place-items:center;border:1.5px solid var(--ink);background:var(--panel);box-shadow:var(--shadow);cursor:pointer;padding:0}
.ico:hover{background:var(--panel-2)}
.ico[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.ico.txt{width:auto;padding:0 12px;font-weight:600;white-space:nowrap}
.ico .sm{display:none}
.avec-retour .cart{max-width:calc(100% - 2 * var(--g) - 220px)}
.ico svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
/* bas : liste des pièces */
.bas{left:calc(var(--g) + env(safe-area-inset-left,0px));right:calc(var(--g) + 256px + env(safe-area-inset-right,0px));bottom:calc(var(--g) + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:6px;align-items:flex-start;pointer-events:none}
.chips{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;max-width:100%;pointer-events:auto;background:color-mix(in srgb,var(--panel) 94%,transparent);border:1.5px solid var(--ink);box-shadow:var(--shadow);padding:5px;
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);padding-right:28px} /* fondu au bord : la liste continue */
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--panel-2);padding:7px 11px;cursor:pointer;white-space:nowrap;font-weight:500;display:flex;gap:6px;align-items:baseline}
.chip small{font-size:11px;color:var(--ink-2)}
.chip:hover{border-color:var(--ink)}
.chip[aria-current="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chip[aria-current="true"] small{color:inherit;opacity:.75}
.mention{font-size:11px;color:#fff;background:rgba(22,25,24,.66);padding:2px 7px;pointer-events:none} /* fond : lisible sur un mur clair (contraste 5,4:1 au pire) */
/* mini-plan */
.carte{right:calc(var(--g) + env(safe-area-inset-right,0px));bottom:calc(var(--g) + env(safe-area-inset-bottom,0px));width:240px;background:var(--plan-bg);border:1.5px solid var(--ink);box-shadow:var(--shadow);
  display:flex;flex-direction:column}
.niv{display:flex;border-bottom:1.5px solid var(--ink)}
.niv button{flex:1;border:0;background:transparent;padding:6px 8px;cursor:pointer;font-weight:600;font-variation-settings:"wdth" 90;font-size:12.5px}
.niv button+button{border-left:1px solid var(--line)}
.niv button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.plan{position:relative;margin:8px;cursor:pointer}
.plan img{display:block;width:100%;height:auto;filter:var(--plan-filtre)}
.plan svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.cone{fill:var(--accent);opacity:.28}
.dot{fill:var(--panel);stroke:var(--ink);stroke-width:1.5;cursor:pointer}
.dot.ici{fill:var(--accent);stroke:var(--panel);stroke-width:2}
.dot-z{fill:transparent;cursor:pointer}
.carte.attente{visibility:hidden} /* plan montré une fois son image chargée : pas de points dans le vide */
.agr{display:none}
/* attente */
#attente{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:var(--paper);transition:opacity .35s}
#attente.fini{opacity:0;pointer-events:none}
#attente .b{width:160px;height:3px;background:var(--line);overflow:hidden}
#attente .b i{display:block;height:100%;width:0;background:var(--ink);transition:width .2s}
#attente p{margin:0 0 12px;font-weight:600;font-variation-settings:"wdth" 90;text-align:center}
.roue{left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:t .8s linear infinite;opacity:0;transition:opacity .2s;pointer-events:none}
.roue.vue{opacity:1}
@keyframes t{to{transform:rotate(360deg)}}
.aide{left:50%;bottom:calc(var(--g) + 76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(22,25,24,.72);color:#fff;padding:8px 14px;font-weight:500;
  pointer-events:none;transition:opacity .5s;white-space:nowrap;font-size:13.5px}
.aide.cache{opacity:0}
#erreur{position:absolute;inset:0;z-index:6;display:none;place-items:center;background:var(--paper);padding:24px;text-align:center}
#erreur button,.toast{border:1.5px solid var(--ink);background:var(--panel);box-shadow:var(--shadow);padding:10px 16px;font-weight:600;cursor:pointer;min-height:44px}
.toast{left:50%;top:50%;transform:translate(-50%,-50%);z-index:4}
@media (max-width:760px){
  :root{--g:12px}
  .ico .lg{display:none} .ico .sm{display:inline}
  .avec-retour .cart{max-width:calc(100% - 2 * var(--g) - 160px)}
  .bas{right:calc(var(--g) + env(safe-area-inset-right,0px));bottom:calc(var(--g) + env(safe-area-inset-bottom,0px))}
  .carte{top:calc(var(--g) + 58px + env(safe-area-inset-top,0px));bottom:auto;width:132px}
  .carte .plan{margin:5px}
  .carte.large{width:176px}
  .carte.grand{width:min(92vw,440px)}
  .carte.grand .plan{margin:10px}
  .niv button{padding:5px 4px;font-size:11.5px}
  .cart .p{font-size:18px}
  .aide{bottom:calc(var(--g) + 92px + env(safe-area-inset-bottom,0px));font-size:12.5px;white-space:normal;text-align:center;width:max-content;max-width:86vw}
  .chip{padding:8px 11px}
}
/* doigt : cibles de 44 px au moins */
@media (pointer:coarse){ .chip{min-height:44px;align-items:center} .niv button{min-height:44px} }
/* téléphone en paysage : plan réduit, dans l'écran */
@media (max-height:500px){
  :root{--g:10px}
  .carte{top:auto;bottom:calc(var(--g) + env(safe-area-inset-bottom,0px));width:auto}
  .carte .plan{margin:4px}
  .carte .plan img{width:auto;height:auto;max-width:150px;max-height:calc(100vh - 2 * var(--g) - 120px)}
  .carte.grand .plan img{max-width:min(60vw,440px);max-height:calc(100vh - 2 * var(--g) - 60px)}
  .bas{right:calc(var(--g) + 190px + env(safe-area-inset-right,0px))}
  .aide{bottom:calc(var(--g) + 64px + env(safe-area-inset-bottom,0px))}
  .cart .p{font-size:17px}
}
@media (prefers-reduced-motion: reduce){ .roue{animation:none} #attente,.aide,.etq{transition:none} }
</style>
</head>
<body>
<div id="app">
  <canvas id="vue" aria-label="Vue à 360° de la pièce : glisser pour regarder autour" role="img"></canvas>
  <svg id="points" aria-hidden="false"></svg>
  <div class="etq" id="etq" aria-hidden="true"></div>
  <div class="ui roue" id="roue" aria-hidden="true"></div>
  <div class="ui cart" aria-live="polite"><div class="k">Visite à 360°</div><div class="p" id="piece"></div><div class="n" id="niveau"></div></div>
  <div class="ui outils">
    <button class="ico txt" id="retour" type="button" hidden title="Revenir à la visite 3D, au même endroit"><span class="lg">Visite 3D</span><span class="sm">3D</span></button>
    <button class="ico" id="gyro" hidden aria-pressed="false" title="Regarder en bougeant le téléphone" aria-label="Regarder en bougeant le téléphone">
      <svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M3 8.5c-1.3 2.2-1.3 4.8 0 7M21 8.5c1.3 2.2 1.3 4.8 0 7"/></svg></button>
    <button class="ico" id="plein" hidden title="Plein écran" aria-label="Plein écran">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
  <div class="ui bas"><div class="mention">Illustration non contractuelle</div><nav class="chips" id="chips" aria-label="Pièces"></nav></div>
  <div class="ui carte attente" id="carte"><div class="niv" id="niv" hidden></div><div class="plan" id="plan"><img id="planImg" alt=""><svg id="planSvg"></svg></div></div>
  <div class="ui aide" id="aide">Glissez pour regarder autour de vous · touchez un cercle pour avancer</div>
  <div id="attente"><div><p>Chargement de la visite…</p><div class="b"><i id="barre"></i></div></div></div>
  <button class="ui toast" id="reseau" type="button" hidden>Connexion interrompue. Touchez pour réessayer.</button>
  <div id="erreur"><div><p id="erreurTexte">La visite à 360° ne peut pas s’afficher sur cet appareil.</p><button type="button" id="reessayer" hidden>Réessayer</button></div></div>
</div>
</body>
</html>
